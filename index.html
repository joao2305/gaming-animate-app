<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GamingAnimateApp</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <div class="item active" style="--background: #003791">
            <div class = "title">Playstation</div>
            <img src ="./imgs/particulas_playstation.png" class="effect">
            <img src ="./imgs/ps5.png" class="controller">
        </div>
        <div class="item " style="--background: #107C10">
            <div class = "title">Microsoft Xbox</div>
            <img src ="./imgs/particulas_xbox.png" class="effect">
            <img src ="./imgs/xbox.png" class="controller">
        </div>
        <div class="item" style="--background: #E60012">
            <div class = "title">Nintendo</div>
            <img src ="./imgs/particulas_nintendo.png" class="effect">
            <img src ="./imgs/switch.png" class="controller">
        </div>

        <div class="arrow">
            <button id ="prev"> < </button>
            <button id ="next"> > </button>
        </div>
    </main>
</body>
<script src="./script.js"></script>
</html>
